name: Dependency Management

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of update to perform'
        required: true
        default: 'security'
        type: choice
        options:
        - security
        - minor
        - all

jobs:
  security-updates:
    name: Security Updates
    runs-on: ubuntu-latest
    if: github.event.inputs.update_type == 'security' || github.event.schedule
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install npm-check-updates
      run: npm install -g npm-check-updates
      
    - name: Check for security vulnerabilities
      run: npm audit --audit-level=moderate
      
    - name: Fix security vulnerabilities
      run: npm audit fix
      
    - name: Update package-lock.json
      run: npm install
      
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'fix: update dependencies to fix security vulnerabilities'
        title: 'Security Updates - Dependency Fixes'
        body: |
          ## Security Updates
          
          This PR contains automatic security updates for npm dependencies.
          
          ### Changes
          - Fixed security vulnerabilities found in dependencies
          - Updated package-lock.json
          
          ### Testing
          - [ ] Run full test suite
          - [ ] Verify application functionality
          - [ ] Check for breaking changes
          
          **Auto-generated by GitHub Actions**
        branch: security-updates
        delete-branch: true

  dependency-updates:
    name: Minor Dependency Updates
    runs-on: ubuntu-latest
    if: github.event.inputs.update_type == 'minor' || github.event.inputs.update_type == 'all'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install npm-check-updates
      run: npm install -g npm-check-updates
      
    - name: Update minor versions
      run: ncu -u --target minor
      
    - name: Install updated dependencies
      run: npm install
      
    - name: Run tests
      run: npm test
      
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies to latest minor versions'
        title: 'Minor Dependency Updates'
        body: |
          ## Minor Dependency Updates
          
          This PR contains automatic minor version updates for npm dependencies.
          
          ### Changes
          - Updated dependencies to latest minor versions
          - All tests passing
          
          ### Testing
          - [x] Test suite passed
          - [ ] Manual testing required
          - [ ] Review breaking changes
          
          **Auto-generated by GitHub Actions**
        branch: dependency-updates
        delete-branch: true

  major-updates:
    name: Major Dependency Updates
    runs-on: ubuntu-latest
    if: github.event.inputs.update_type == 'all'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install npm-check-updates
      run: npm install -g npm-check-updates
      
    - name: Check for major updates
      run: ncu --target major
      
    - name: Generate dependency report
      run: |
        echo "# Major Dependency Updates Available" > dependency-report.md
        echo "" >> dependency-report.md
        echo "The following major updates are available:" >> dependency-report.md
        echo "" >> dependency-report.md
        ncu --target major >> dependency-report.md
        
    - name: Create Issue for Major Updates
      uses: peter-evans/create-or-update-comment@v3
      with:
        issue-number: ${{ github.event.number }}
        body-file: dependency-report.md

  vulnerability-scan:
    name: Vulnerability Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
        
    - name: Upload result to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: snyk.sarif
        
    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'blog-admin-panel'
        path: '.'
        format: 'ALL'
        
    - name: Upload OWASP results
      uses: actions/upload-artifact@v3
      with:
        name: dependency-check-report
        path: reports/
